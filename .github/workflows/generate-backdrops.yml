name: Generate Backdrops

# Runs 1st of every month at 03:00 UTC
# Can also be triggered manually from the Actions tab anytime
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

# S2 fix: queue runs instead of racing (manual + scheduled overlap otherwise)
concurrency:
  group: backdrops
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run generate.py
        env:
          TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
          FANART_API_KEY:  ${{ secrets.FANART_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: python3 scripts/generate.py

      - name: Generate manifest.json
        if: success()
        run: |
          find . -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.gif" -o -name "*.webp" -o -name "*.webm" -o -name "*.svg" -o -name "*.avif" -o -name "*.mp4" \) \
            -not -path "./.git/*" \
            -not -path "./scripts/*" \
            | sed 's|^\./||' \
            | sort \
            | python3 -c "import sys,json; files=[l.strip() for l in sys.stdin if l.strip()]; print(json.dumps(files,indent=2))" \
            > manifest.json

      - name: Commit updated backdrops
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: regenerate backdrops [skip ci] [$(date -u '+%Y-%m-%d')]"
          git pull --rebase origin main
          git push
